# Native simulator requires emulation framework for i2c@100
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_GPIO_EMUL=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y
CONFIG_FLASH_SIMULATOR=y

# SMBus support for simulator (using emulated SMBus on emulated I2C)
CONFIG_SMBUS=y
CONFIG_SMBUS_EMUL=y
CONFIG_I2C_TARGET=y
CONFIG_SMBUS_TARGET=y
CONFIG_CRC=y
CONFIG_TT_BH_ARC=y
CONFIG_TT_BH_ARC_EMUL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_EMUL=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_WATCHDOG=y
CONFIG_WDT_TT_BH=y

# In QEMU icount mode, allow virtual time to jump to timer deadlines while sleeping.
CONFIG_QEMU_ICOUNT_SLEEP=y

# Shell requires an explicit backend; native_sim works with serial console.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_PROMPT_UART="sim-tt:~$ "

# Keep ringbuf for send_logs_to_smc() and also allow UART console output.
CONFIG_LOG_BACKEND_RINGBUF=y
CONFIG_LOG_BACKEND_UART=y
# Keep tt_virt scratch-register logging backend disabled on qemu_virt-based sim board.
CONFIG_LOG_BACKEND_TT_VIRT=n

CONFIG_DEBUG=y
#CONFIG_ASSERT=y

CONFIG_TT_BIST=n
CONFIG_JTAG_LOAD_BOOTROM=n