CONFIG_TT_MMK_BUN2_LOADER=y

# BUN2 loader jumps to BL1 during driver init and never reaches main(); the PVT sensor
# driver and MCUboot flash-confirm logic are unused in this variant.
CONFIG_SENSOR=n
CONFIG_FLASH=n

# No float/double formatting needed in this variant's printk/printf usage, but the
# bun2_loader driver logs 64-bit values so long long integer support must stay.
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_PICOLIBC_IO_LONG_LONG=y

# BUN2 loader jumps to BL1 and never returns; no interrupts are serviced and the idle
# thread is never scheduled, so their stacks can be shrunk to the bare minimum.
CONFIG_ISR_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
